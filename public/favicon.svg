<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2b"/>
      <stop offset="1" stop-color="#070a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1e6fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1e6fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="live" gradientUnits="userSpaceOnUse" x1="168" y1="0" x2="344" y2="0">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect id="tile" width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="196" fill="url(#glow)"/>
  <!-- circuit ring, blue/cyan like the sibling app -->
  <g fill="none" stroke-linecap="round" stroke-width="20">
    <path d="M92 256 A164 164 0 0 1 420 256" stroke="#3d8bff"/>
    <path d="M92 256 A164 164 0 0 0 420 256" stroke="#22d3ee"/>
  </g>
  <g fill="#0b111b"><circle cx="92" cy="256" r="19"/><circle cx="420" cy="256" r="19"/></g>
  <g fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 256 H50 V200" stroke="#3d8bff"/>
    <path d="M420 256 H462 V312" stroke="#22d3ee"/>
  </g>
  <g>
    <circle cx="92" cy="256" r="14" fill="#e8f4ff"/><circle cx="420" cy="256" r="14" fill="#e8f4ff"/>
    <circle cx="50" cy="190" r="12" fill="#3d8bff"/><circle cx="462" cy="322" r="12" fill="#22d3ee"/>
  </g>
  <!-- ladder: rails + one energized rung, contact and coil -->
  <g stroke="#e8f4ff" stroke-width="14" stroke-linecap="round">
    <path d="M168 168 V344"/><path d="M344 168 V344"/>
  </g>
  <g stroke="#3ddc97" stroke-width="16" stroke-linecap="round" filter="url(#soft)" opacity="0.9">
    <path d="M168 256 H344"/>
  </g>
  <g fill="none" stroke="url(#live)" stroke-width="13" stroke-linecap="round">
    <path d="M168 256 H205"/><path d="M245 256 H262"/><path d="M310 256 H344"/>
    <path d="M207 226 V286"/><path d="M243 226 V286"/>
    <path d="M276 228 Q262 256 276 284"/><path d="M296 228 Q310 256 296 284"/>
